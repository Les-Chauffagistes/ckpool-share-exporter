name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:


jobs:
  test:
    uses: Les-Chauffagistes/deploy/.github/workflows/test.yml@be3b94140650519f067162409927358ea8b0723f
    with:
      python-version: '3.13'
    secrets: inherit


  build-push:
    if: github.event_name == 'push'
    needs: test
    uses: Les-Chauffagistes/deploy/.github/workflows/build.yml@be3b94140650519f067162409927358ea8b0723f
    with:
      service-name: ckpool-share-exporter
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      VERDACCIO_PASSWORD: ${{ secrets.VERDACCIO_PASSWORD }}
      PYPISERVER_PASSWORD: ${{ secrets.PYPISERVER_PASSWORD }}
      ORG_PAT: ${{ secrets.ORG_PAT }}